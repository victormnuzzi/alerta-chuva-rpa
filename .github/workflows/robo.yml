name: Robô Alerta Chuva SP

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"   # de hora em hora (UTC)

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes (sucesso, decisão e falha)
        run: python -m unittest discover -s tests -v

  executar:
    needs: testes
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rodar o robô com a previsão real
        env:
          RPA_HASH_SALT: ${{ secrets.RPA_HASH_SALT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TZ: America/Sao_Paulo
        run: python executar.py
      - name: Guardar painel e logs como evidência
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execucao-${{ github.run_id }}
          path: |
            saida/
            logs/
